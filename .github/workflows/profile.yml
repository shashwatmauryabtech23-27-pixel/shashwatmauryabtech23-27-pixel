name: Update Profile README

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "scripts/update-projects.js"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Update public repository list
        run: node scripts/update-projects.js

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: shashwatmauryabtech23-27-pixel
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Commit profile updates
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile data and contribution snake"
          file_pattern: README.md assets/*.svg
